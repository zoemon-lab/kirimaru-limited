<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,"><title>キリマル 限定版</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#152844;font:17px/1.7 system-ui,sans-serif}main{max-width:560px;margin:15vh auto;padding:28px}h1{font-size:28px}p{margin:0}button{padding:8px 14px;font:inherit;border:1px solid #aab6c5;border-radius:8px;background:white;cursor:pointer}</style></head>
<body><main><h1>キリマル 限定版</h1><p id="status" role="status">共有されたリンクから開いてください。</p><noscript>利用するにはJavaScriptを有効にしてください。</noscript></main>
<script>
(async () => {
  const status = document.querySelector('#status');
  const token = location.hash.slice(1);
  if (!token) return;
  if (!/^[a-zA-Z0-9_-]{43}$/.test(token)) {
    status.textContent = '共有リンクが途中で切れています。リンクを末尾までコピーして開いてください。';
    return;
  }
  status.textContent = 'キリマルを開いています…';
  let payload;
  try {
    const url = new URL('./app.enc', location.href);
    const response = await fetch(url, {cache:'no-store',referrerPolicy:'no-referrer'});
    if (!response.ok) throw Error('fetch');
    payload = new Uint8Array(await response.arrayBuffer());
  } catch {
    status.textContent='キリマルを読み込めませんでした。通信状態を確認して再読み込みしてください。';
    return;
  }
  try {
    const bytes = Uint8Array.from(atob(token.replace(/-/g,'+').replace(/_/g,'/')+'='), c=>c.charCodeAt(0));
    const key = await crypto.subtle.importKey('raw',bytes,'AES-GCM',false,['decrypt']);
    const decoded = await crypto.subtle.decrypt({name:'AES-GCM',iv:payload.subarray(0,12)}, key, payload.subarray(12));
    document.open();
    document.write(new TextDecoder().decode(decoded));
    document.close();
  } catch {
    status.textContent='このリンクでは開けません。提供元から届いたリンクを末尾までコピーして開いてください。';
  }
})();
</script></body></html>
